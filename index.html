<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>苏泊丶 | Subo889</title>
<meta name="description" content="苏泊丶（subo889）个人主页：自动化脚本 / Telegram Bot / 虚拟货币 / 项目开发者 / 社区运管。">
<meta name="theme-color" content="#f5f6f8">
<style>
  :root{
    --bg:#f5f6f8;
    --card:#ffffff;
    --text:#1c2330;
    --muted:#6b7280;
    --line:#eceff3;
    --tag-bg:#f1f4f8;
    --tag-text:#3d4a5c;
    --accent:#2aabee;
    --accent-dark:#1f93d1;
    --shadow:0 10px 34px rgba(20,32,50,.08);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Microsoft YaHei","PingFang SC","Segoe UI",system-ui,-apple-system,sans-serif;
    min-height:100vh;
    line-height:1.6;
    padding:48px 16px 32px;
  }
  .container{max-width:640px;margin:0 auto}

  .card{
    background:var(--card);
    border-radius:18px;
    box-shadow:var(--shadow);
    padding:36px 28px;
  }
  .card + .card{margin-top:16px}

  /* 主卡片 */
  .hero{text-align:center}
  .avatar{
    width:96px;height:96px;border-radius:50%;
    object-fit:cover;
    border:3px solid #fff;
    box-shadow:0 6px 20px rgba(20,32,50,.14);
  }
  .name{
    margin-top:18px;
    font-size:28px;font-weight:700;letter-spacing:1px;
  }
  .role{
    margin-top:8px;
    font-size:15px;color:var(--accent);font-weight:600;
  }
  .focus{
    margin-top:10px;
    font-size:14px;color:var(--muted);
  }

  /* 标签 */
  .tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:20px}
  .tag{
    background:var(--tag-bg);color:var(--tag-text);
    font-size:13px;
    padding:6px 13px;border-radius:999px;
  }

  /* 联系按钮 */
  .links{
    display:flex;flex-wrap:wrap;gap:12px;justify-content:center;
    margin-top:26px;
  }
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    text-decoration:none;font-size:14px;font-weight:600;
    padding:10px 20px;border-radius:12px;
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .btn:active{transform:scale(.97)}
  .btn-primary{background:var(--accent);color:#fff;box-shadow:0 6px 16px rgba(42,171,238,.32)}
  .btn-primary:hover{background:var(--accent-dark)}
  .btn-ghost{background:#fff;color:var(--text);border:1px solid var(--line)}
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
  .btn svg{width:16px;height:16px;fill:currentColor}

  /* 区块标题 */
  .section-title{
    font-size:16px;font-weight:700;
    display:flex;align-items:center;gap:8px;
    margin-bottom:16px;
  }
  .section-title .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}

  /* 项目占位 */
  .project-empty{
    border:1px dashed var(--line);
    border-radius:14px;
    padding:26px 18px;
    text-align:center;
    color:var(--muted);
    font-size:14px;
  }

  footer{
    text-align:center;
    color:var(--muted);
    font-size:12px;
    margin-top:28px;
  }
  footer a{color:var(--muted);text-decoration:none}
  footer a:hover{color:var(--accent)}

  /* 入场动画 */
  @keyframes fadeUp{
    from{opacity:0;transform:translateY(14px)}
    to{opacity:1;transform:translateY(0)}
  }
  .card{animation:fadeUp .5s ease both}
  .card:nth-child(2){animation-delay:.08s}
  .card:nth-child(3){animation-delay:.16s}

  @media (max-width:480px){
    body{padding:28px 12px 24px}
    .card{padding:28px 20px}
    .name{font-size:24px}
  }
</style>
</head>
<body>
  <main class="container">

    <!-- 主卡片：头像 / 昵称 / 简介 / 技能标签 / 联系 -->
    <section class="card hero">
      <img class="avatar" src="https://avatars.githubusercontent.com/u/145550757?v=4" alt="苏泊丶 头像">
      <h1 class="name">苏泊丶</h1>

          <svg viewBox="0 0 24 24"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.55 0-.27-.01-1.17-.02-2.12-3.2.7-3.87-1.36-3.87-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.19 1.76 1.19 1.03 1.76 2.69 1.25 3.35.96.1-.75.4-1.25.72-1.54-2.55-.29-5.23-1.28-5.23-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.78 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.41-2.69 5.38-5.25 5.67.41.36.78 1.06.78 2.14 0 1.55-.01 2.8-.01 3.18 0 .3.2.67.8.55A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/></svg>
          GitHub
        </a>
      </div>
    </section>

    <!-- 项目与作品 -->

      <h2 class="section-title"><span class="dot"></span>项目与作品</h2>
      <div class="project-empty">更多项目正在整理中，敬请期待。</div>
    </section>

    <footer>
      © 2026 苏泊丶 · Hosted on <a href="https://pages.github.com" target="_blank" rel="noopener">GitHub Pages</a>

  </main>
</body>
</html>
